<!doctype html>
<html lang="ja"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>TikTok OAuth callback</title><style>body{max-width:48rem;margin:3rem auto;padding:0 1rem;color:#202124;font-family:system-ui,sans-serif;line-height:1.6}code{overflow-wrap:anywhere}.panel{padding:1rem;border:1px solid #d0d7de;border-radius:.5rem;background:#f6f8fa}</style></head><body><h1>TikTok OAuth callback</h1><p>TikTokから認証結果が返りました。このページは認証コードを外部へ送信しません。</p><div class="panel"><p><strong>code</strong></p><code id="code">認証コードがありません。</code><p><strong>state</strong></p><code id="state">stateがありません。</code><p><strong>error</strong></p><code id="error">なし</code></div><script>const p=new URLSearchParams(location.search);document.querySelector('#code').textContent=p.get('code')||'認証コードがありません。';document.querySelector('#state').textContent=p.get('state')||'stateがありません。';document.querySelector('#error').textContent=p.get('error_description')||p.get('error')||'なし';</script></body></html>
